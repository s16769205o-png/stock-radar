name: 小G股票雷達 1.24｜台股三大法人研究室

on:
  push:
    paths:
      # 兼容手機重複下載後的 (1) 等檔名。
      - '.github/workflows/institutional-v124*.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-install-institutional-v124
  cancel-in-progress: false

