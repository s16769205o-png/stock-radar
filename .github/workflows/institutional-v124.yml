          version=m.group(1) if m else 'unknown'
          if version=='1.23':
              changes=[
                ('小G 股票雷達 1.23：', '小G 股票雷達 1.24：'),
                ('<title>小G股票雷達 1.23</title>','<title>小G股票雷達 1.24</title>'),
                ('STOCK RESEARCH LAB · 1.23</div>','STOCK RESEARCH LAB · 1.24</div>'),
                ('from site_quality import verify_site',
                 'from institutional_flow import institutional_section\nfrom site_quality import verify_site'),
                ("    '20日觀察報酬','20日基準報酬',\n]",
                 "    '20日觀察報酬','20日基準報酬',\n"
                 "    '外資買賣超股數','投信買賣超股數','自營商買賣超股數',\n"
                 "    '三大法人買賣超股數','法人資料狀態',\n]"),
                ("        merged[key]=row\n    rows=list(merged.values())",
                 "            for field in ('外資買賣超股數','投信買賣超股數','自營商買賣超股數',\n"
                 "                          '三大法人買賣超股數','法人資料狀態'):\n"
                 "                if merged[key].get(field,'')!='' and row.get(field,'')=='':\n"
                 "                    row[field]=merged[key][field]\n"
                 "        merged[key]=row\n    rows=list(merged.values())"),
                ('    {industry_readiness_section(UNIVERSE, INDUSTRY)}\n'
                 '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}',
                 '    {industry_readiness_section(UNIVERSE, INDUSTRY)}\n'
                 '    {institutional_section(UNIVERSE, INDUSTRY, history_rows, records)}\n'
                 '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}'),
                ('<div><b>25%</b>法人買賣<small>尚未接入</small></div>',
                 '<div><b>25%</b>法人買賣<small>建置中：台股官方三大法人方向觀察，25分評分尚未啟用</small></div>'),
                ('預定四大權重30／30／25／15未變，目前只有技術面提供分數；尚無產業前景、法人、新聞完整量化評分。',
                 '預定四大權重30／30／25／15未變，目前僅技術面提供正式試驗分數；產業前景與台股法人已有觀察資料但尚未正式評分，國際新聞尚未接入。'),
              ]
              new=old
              for before,after in changes:
                  # after is a Python literal containing newlines; no repeated application.
                  if new.count(before)!=1:
                      raise SystemExit('1.23 原始程式標記數量異常，為避免破壞原網站已停止：'+before[:70])
                  new=new.replace(before,after,1)
              if guard.count("'STOCK RESEARCH LAB · 1.22'")!=1:
                  raise SystemExit('網站驗收標記異常，停止安裝')
              checked=guard.replace("'STOCK RESEARCH LAB · 1.22'",
                 "'STOCK RESEARCH LAB · 1.24',\n    '🇹🇼 台股｜法人買賣超研究室・1.24'",1)
              compile(new,'radar.py','exec')
              compile(checked,'site_quality.py','exec')
              Path('institutional_flow.py').write_text(code,encoding='utf-8')
              quality.write_text(checked,encoding='utf-8')
              radar.write_text(new,encoding='utf-8')
              print('1.24 研究模組、歷史保存欄位與網站驗收已安裝')
          elif version=='1.24':
              if 'from institutional_flow import institutional_section' not in old:
                  raise SystemExit('1.24 模組缺失，未安全完成安裝')
              if '🇹🇼 台股｜法人買賣超研究室・1.24' not in guard:
                  raise SystemExit('1.24 網站驗收標記缺失')
              if not Path('institutional_flow.py').exists():
                  Path('institutional_flow.py').write_text(code,encoding='utf-8')
              print('已是 1.24；重複執行不修改原本版本')
          else:
              raise SystemExit('目前版本 '+version+'；僅允許 1.23 升 1.24，不覆寫未知版本')
          PY_UPGRADE

      - name: 保存法人模組與既有程式
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py site_quality.py institutional_flow.py
          if ! git diff --cached --quiet; then
            git commit -m 'Install stock radar v1.24 TWSE institutional research'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝原有程式依賴
        run: pip install -r requirements.txt
      - name: 更新股票雷達與法人資料
        run: python radar.py

      - name: 保存研究網站與既有歷史（法人欄位存入原 history.csv）
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh v1.24 institutional and market research history'
            git push || echo '::warning::遇到其他掃描同時推送；網站仍可發佈，下次正常掃描會再保存'
          fi

      - name: 準備手機報告
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳網站成品
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布小G股票研究別墅 1.24
        id: publish
        uses: actions/deploy-pages@v4
