
name: 小G股票雷達

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一至週五 16:40
    - cron: "40 8 * * 1-5"
    # 台灣時間週二至週六 07:40
    - cron: "40 23 * * 1-5"

# Both scheduled runs use one publishing lock to avoid overlapping pushes/deploys.
concurrency:
  group: stock-radar-daily-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 取得專案
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝工具
        run: pip install -r requirements.txt

      - name: 執行股票雷達
        env:
          # Optional: truthful product/contact identity for official SEC XBRL APIs.
          # Do not place any personal address in public repository source files.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python radar.py

      - name: 保存掃描紀錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Archive source snapshots alongside the report that used them.
          git add index.html data/history.csv data/monthly_revenue.csv data/quarterly_profit.csv
          if ! git diff --cached --quiet; then
            git commit -m "更新股票雷達報告"
            git push
          fi

      - name: 準備手機報告
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          cp data/monthly_revenue.csv _site/data/monthly_revenue.csv
          cp data/quarterly_profit.csv _site/data/quarterly_profit.csv
          # Separate, public application CODE only; personal holdings stay browser-local.
          test -s holdings-risk.html && test -s risk_house_v1.js
          cp holdings-risk.html _site/holdings-risk.html
          cp risk_house_v1.js _site/risk_house_v1.js

      - name: 上傳網頁
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    steps:
      - name: 發布股票雷達網頁
        id: publish
        uses: actions/deploy-pages@v4
