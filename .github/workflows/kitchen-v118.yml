          expected_sha256 = '957979471a808fe49ac4999d4588e001d629f339b3c62d01d68dfb694a676e42'
          if hashlib.sha256(source.encode('utf-8')).hexdigest() != expected_sha256:
              raise SystemExit('施工模組驗證失敗：檔案可能不完整')
          compile(source, 'villa_hub.py', 'exec')
          radar_path=Path('radar.py')
          old=radar_path.read_text(encoding='utf-8')
          hit=re.search(r'STOCK RESEARCH LAB · (\d+\.\d+)',old)
          if not hit:
              raise SystemExit('找不到主程式版本；停止以保護已上線的雷達')
          version=hit.group(1)
          module=Path('villa_hub.py')
          if version=='1.18':
              if not module.exists() or hashlib.sha256(module.read_bytes()).hexdigest()!=expected_sha256:
                  raise SystemExit('1.18 已安裝但廚房模組不同；停止，勿覆寫未知版本')
              print('1.18 已安裝，無需重複修改')
          elif version=='1.17':
              replacements=[
                  ('小G 股票雷達 1.17：', '小G 股票雷達 1.18：'),
                  ('<title>小G股票雷達 1.17</title>', '<title>小G股票雷達 1.18</title>'),
                  ('STOCK RESEARCH LAB · 1.17', 'STOCK RESEARCH LAB · 1.18'),
              ]
              if old.count('from villa_hub import install_villa_hub')!=1 or old.count('    install_villa_hub(SITE_FILE, records)')!=1:
                  raise SystemExit('原有別墅架構不完整；不進行升級')
              if old.count('from system_health import health_section')!=1:
                  raise SystemExit('1.17 機電總控室缺失；停止升級')
              new=old
              for before,after in replacements:
                  if new.count(before)!=1:
                      raise SystemExit('版本標記數量異常：'+before)
                  new=new.replace(before,after,1)
              compile(new,'radar.py','exec')
              module.write_text(source,encoding='utf-8')
              radar_path.write_text(new,encoding='utf-8')
              print('已將 1.17 升級至 1.18；舊清單原樣保留在使用者瀏覽器')
          else:
              raise SystemExit('目前版本 '+version+'，僅允許 1.17 升至1.18；不覆蓋未知版本')
          PY_UPGRADE

      - name: 保存新廚房模組與版本
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py villa_hub.py
          if ! git diff --cached --quiet; then
            git commit -m 'Install stock-radar v1.18 private holdings kitchen'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 安裝現有 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝既有程式依賴
        run: pip install -r requirements.txt
      - name: 重新產生股票雷達與廚房
        run: python radar.py

      - name: 保存研究快照（如遇同時更新，仍保留網站發布）
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          for f in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh v1.18 stock radar kitchen snapshot'
            git push || echo '::warning::資料存檔推送與其他掃描撞期；網站仍會發佈，後續排程可再保存快照'
          fi

      - name: 準備手機網站檔案
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳 GitHub Pages 網站檔案
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布小G股票雷達 1.18
        id: publish
        uses: actions/deploy-pages@v4
