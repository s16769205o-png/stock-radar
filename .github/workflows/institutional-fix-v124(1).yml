name: 小G股票雷達 1.24｜法人研究室插入位置修復

on:
  push:
    paths:
      - '.github/workflows/institutional-fix-v124*.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-repair-install-v124
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: 取得現有股票研究別墅
        uses: actions/checkout@v4

      - name: 修復 1.24 插入點並重用原本法人模組安裝器
        shell: bash
        run: |
          python - <<'PY_FIX'
          from pathlib import Path
          import re
          import textwrap

          original_file = Path('.github/workflows/institutional-v124.yml')
          raw = original_file.read_text(encoding='utf-8')
          start_match = re.search(r"(?m)^\s*python - <<'PY_UPGRADE'\s*$", raw)
          if not start_match:
              raise SystemExit('找不到原本的 1.24 安裝器；保留 1.23 不變')
          tail_match = re.search(r'(?m)^\s*PY_UPGRADE\s*$', raw[start_match.end():])
          if not tail_match:
              raise SystemExit('原本安裝器結尾不完整；停止更新')
          embedded = raw[start_match.end():start_match.end()+tail_match.start()]
          installer = textwrap.dedent(embedded).strip() + '\n'

          # 1.23 added sector_evidence_section between readiness and health.
          # The original 1.24 upgrade incorrectly expected these to be adjacent.
          before = "('    {industry_readiness_section(UNIVERSE, INDUSTRY)}\\n'"
          after = "('<div><b>25%</b>法人買賣"
          if installer.count(before) != 1 or installer.count(after) != 1:
              raise SystemExit('原安裝器片段不符合預期；不擅自修改')
          a = installer.index(before)
          b = installer.index(after, a)
          fixed = r"""('    {industry_readiness_section(UNIVERSE, INDUSTRY)}\n'
             '    {sector_evidence_section(UNIVERSE, INDUSTRY)}\n'
             '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}',
             '    {industry_readiness_section(UNIVERSE, INDUSTRY)}\n'
             '    {sector_evidence_section(UNIVERSE, INDUSTRY)}\n'
             '    {institutional_section(UNIVERSE, INDUSTRY, history_rows, records)}\n'
             '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}'),
            """
          installer = installer[:a] + fixed + installer[b:]
          # 1.23 also advanced the website validator's expected version.
          # The old 1.24 installer still checks for the 1.22 validator.
          outdated = "'STOCK RESEARCH LAB · 1.22'"
          current = "'STOCK RESEARCH LAB · 1.23'"
          if installer.count(outdated) != 2:
              raise SystemExit('原安裝器驗收版本檢查不符合預期；拒絕冒險修補')
          installer = installer.replace(outdated, current)
          compile(installer, 'v124_safe_installer.py', 'exec')
          radar = Path('radar.py').read_text(encoding='utf-8')
          if '小G 股票雷達 1.23：' in radar:
              expected = ('    {industry_readiness_section(UNIVERSE, INDUSTRY)}\n'
                          '    {sector_evidence_section(UNIVERSE, INDUSTRY)}\n'
                          '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}')
              if radar.count(expected) != 1:
                  raise SystemExit('1.23 程式布局不符；保護現有網頁')
          elif '小G 股票雷達 1.24：' not in radar:
              raise SystemExit('不是已確認的 1.23 或 1.24；拒絕覆寫未來版本')
          Path('v124_safe_installer.py').write_text(installer, encoding='utf-8')
          print('已修正 1.23 新增的產業試算模組插入點')
          PY_FIX
          python v124_safe_installer.py
          rm v124_safe_installer.py

      - name: 儲存法人研究模組與版本
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py site_quality.py institutional_flow.py
          if ! git diff --cached --quiet; then
            git commit -m 'Repair and install 1.24 institutional-flow study'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 安裝既有 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝研究依賴
        run: pip install -r requirements.txt
      - name: 執行每日雷達並產生 1.24 網頁
        run: python radar.py

      - name: 儲存最新網頁及法人歷史資料
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated stock radar 1.24 with institutional history'
            git push || echo '::warning::同時掃描提交發生衝突；本次會繼續發布，請核對下次自動存檔'
          fi
      - name: 準備手機網站
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳 GitHub Pages 網頁
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布股票雷達 1.24 法人研究室
        id: publish
        uses: actions/deploy-pages@v4
