          """
          source=gzip.decompress(base64.b64decode(packed))
          if hashlib.sha256(source).hexdigest()!='c9b7090b0c7e73e69f6df1201d8cf8e6f365b7dfe0f8c585c0a4b10176b0d6c9':
              raise SystemExit('1.20 模組校驗失敗，拒絕修改程式')
          compile(source.decode('utf-8'),'villa_search.py','exec')
          path=Path('radar.py')
          original=path.read_text(encoding='utf-8')
          match=re.search(r'<div class="eyebrow">STOCK RESEARCH LAB · ([0-9.]+)</div>',original)
          if not match:raise SystemExit('無法查證目前雷達版本')
          version=match.group(1)
          if version=='1.19':
              if 'from system_health import health_section' not in original:
                  raise SystemExit('1.17 健康模組缺失；停止升級')
              changes=[
                ('from famous_13f import install_famous_room',
                 'from famous_13f import install_famous_room\nfrom villa_search import install_stock_search'),
                ('    install_famous_room(SITE_FILE)',
                 '    install_famous_room(SITE_FILE)\n    install_stock_search(SITE_FILE)'),
                ('小G 股票雷達 1.19：','小G 股票雷達 1.20：'),
                ('<title>小G股票雷達 1.19</title>','<title>小G股票雷達 1.20</title>'),
                ('STOCK RESEARCH LAB · 1.19','STOCK RESEARCH LAB · 1.20'),
              ]
              modified=original
              for before,after in changes:
                  if modified.count(before)!=1:
                      raise SystemExit('版本修改點異常，停止：'+before[:50])
                  modified=modified.replace(before,after,1)
              compile(modified,'radar.py','exec')
              path.write_text(modified,encoding='utf-8')
              Path('villa_search.py').write_bytes(source)
              print('已從 1.19 安裝 1.20 搜尋；每日掃描與自選股資料不變')
          elif version=='1.20':
              if not Path('villa_search.py').is_file():
                  Path('villa_search.py').write_bytes(source)
              print('目前已是 1.20，跳過重複修改')
          else:
              raise SystemExit('只允許由 1.19 升到 1.20，或重跑 1.20；目前 '+version)
          PY_UPGRADE

      - name: 保存搜尋模組
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py villa_search.py
          if ! git diff --cached --quiet; then
            git commit -m 'Install 1.20 client-side stock search'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 直接為已保存的網頁加上搜尋（不需要重新抓行情）
        shell: bash
        run: |
          python - <<'PY_HTML'
          from pathlib import Path
          from villa_search import install_stock_search
          path=Path('index.html')
          original=path.read_text(encoding='utf-8')
          version='STOCK RESEARCH LAB · 1.19'
          if version in original:
              changes=[
                (version,'STOCK RESEARCH LAB · 1.20'),
                ('<title>小G股票雷達 1.19</title>','<title>小G股票雷達 1.20</title>'),
              ]
              for a,b in changes:
                  if original.count(a)!=1:raise SystemExit('舊頁面版本不唯一，停止覆寫')
                  original=original.replace(a,b,1)
              path.write_text(original,encoding='utf-8')
          elif 'STOCK RESEARCH LAB · 1.20' not in original:
              raise SystemExit('舊頁面不是 1.19 或 1.20，停止覆寫')
          install_stock_search(path)
          assert 'stock-radar-villa-search-1.20' in path.read_text(encoding='utf-8')
          print('1.20 手機網頁搜尋已安裝；原本行情快照保留')
          PY_HTML

      - name: 保存網頁
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 1.20 overview stock finder'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 打包手機網站
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done

      - name: 上傳網頁檔案
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布小G股票雷達 1.20
        id: publish
        uses: actions/deploy-pages@v4
