name: 小G股票雷達 1.20｜全棟股票快速搜尋

on:
  push:
    paths:
      - '.github/workflows/quickfind-v120*.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-v120-quickfind
  cancel-in-progress: false

jobs:
