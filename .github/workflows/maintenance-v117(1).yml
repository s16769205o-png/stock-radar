          PY_UPGRADE

      - name: 保存新的機電模組
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py system_health.py pipeline_audit.py
          if ! git diff --cached --quiet; then
            git commit -m 'Install v1.17 stock radar health dashboard'
            git push
          fi

      - name: 停用過時的三套週日更新流程並驗證 GitHub API 回應
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python pipeline_audit.py

      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝現有研究工具
        run: pip install -r requirements.txt

      - name: 檢查 100 檔行情並產生健康報告
        run: python radar.py

      - name: 保存研究資料與排程稽核結果
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv data/maintenance_status.json
          for f in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh 1.17 radar health and official archives'
            git push
          fi

      - name: 準備手機版網站
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done

      - name: 上傳網站成品
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: ${{ false }}  # Legacy installer retired; never run jobs
    needs: install_and_audit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布小G股票雷達 1.17
        id: publish
        uses: actions/deploy-pages@v4
