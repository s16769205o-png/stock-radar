          if 'STOCK RESEARCH LAB · 1.12' in src:
              if 'from mobile_tabs import install_mobile_tabs' not in src or 'install_mobile_tabs(SITE_FILE)' not in src:
                  raise SystemExit('偵測到不完整1.12，停止避免覆蓋現有網站')
              updated = src
              print('已是完整1.12版，不重複修改')
          else:
              if src.count('STOCK RESEARCH LAB · 1.11') != 1:
                  raise SystemExit('找不到唯一的1.11版程式標記，停止保護現有雷達')
              changes = [
                  ('from fundamental_crosscheck import fundamental_crosscheck_section',
                   'from fundamental_crosscheck import fundamental_crosscheck_section\nfrom mobile_tabs import install_mobile_tabs'),
                  ("    SITE_FILE.write_text(page,encoding='utf-8')",
                   "    SITE_FILE.write_text(page,encoding='utf-8')\n    install_mobile_tabs(SITE_FILE)"),
                  ('小G 股票雷達 1.11：','小G 股票雷達 1.12：'),
                  ('小G股票雷達 1.11','小G股票雷達 1.12'),
                  ('STOCK RESEARCH LAB · 1.11','STOCK RESEARCH LAB · 1.12'),
              ]
              updated = src
              for before, after in changes:
                  if updated.count(before) != 1:
                      raise SystemExit(f'施工位置數量不符（{updated.count(before)}）：{before[:42]}')
                  updated=updated.replace(before,after,1)
              if '# STOCK RESEARCH LAB · 1.11' not in updated:
                  updated += '\n# STOCK RESEARCH LAB · 1.11\n'
              compile(updated, 'radar.py', 'exec')
          Path('mobile_tabs.py').write_text(module,encoding='utf-8')
          if updated != src:
              file.write_text(updated,encoding='utf-8')
          print('完成1.12安裝：不改動原本歷史資料、分數與排程。')
          PY_UPGRADE
      - name: 保存 1.12 程式檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.py mobile_tabs.py
          if ! git diff --cached --quiet; then
            git commit -m "Radar v1.12: Taiwan and US mobile tabs"
            git push
          fi
      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝原本工具
        run: pip install -r requirements.txt
      - name: 更新分頁版股票雷達
        run: python radar.py
      - name: 保存網站與歷史資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/history.csv
          for file in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Publish v1.12 mobile navigation report"
            git push
          fi
      - name: 準備 GitHub Pages 網站
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for file in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$file" ]; then cp "$file" _site/data/; fi
          done
      - name: 上傳網頁
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布分頁版網站
        id: publish
        uses: actions/deploy-pages@v4
