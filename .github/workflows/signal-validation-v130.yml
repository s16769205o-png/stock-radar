name: 小G股票雷達 1.30｜訊號有效性驗證室

on:
  push:
    paths:
      - '.github/workflows/signal-validation-v130.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-signal-validation-v130
  cancel-in-progress: false

