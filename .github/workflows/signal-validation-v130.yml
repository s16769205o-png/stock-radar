          if hashlib.sha256(content).hexdigest() != EXPECTED_SHA:
              raise SystemExit('1.30 安裝檔完整性驗證失敗：保留原站')
          compile(content.decode('utf-8'), 'signal_validation_v130.py', 'exec')
          radar_path=Path('radar.py')
          quality_path=Path('site_quality.py')
          necessary=(radar_path,quality_path,Path('history_lab_v129.py'),Path('sector_diagnostics_v128.py'))
          if any(not item.is_file() for item in necessary):
              raise SystemExit('1.30 升級缺少既有必要檔案：保留原站')
          source=radar_path.read_text(encoding='utf-8')
          quality=quality_path.read_text(encoding='utf-8')
          version_match=re.search(r'^"""小G 股票雷達 ([0-9.]+)：',source)
          version=version_match.group(1) if version_match else 'unknown'
          
          
          def replace_once(source,old,new,where):
              count=source.count(old)
              if count!=1:
                  raise SystemExit(f'1.30 不相容：{where} 標記出現 {count} 次，保留原站：{old[:60]}')
              return source.replace(old,new,1)
          
          
          if version=='1.29':
              target=Path('signal_validation_v130.py')
              if target.exists():
                  raise SystemExit('1.30 目標模組已存在，但版本仍為1.29：避免覆寫未知程式')
              edits=[
                  ('小G 股票雷達 1.29：','小G 股票雷達 1.30：'),
                  ('<title>小G股票雷達 1.29</title>','<title>小G股票雷達 1.30</title>'),
                  ('STOCK RESEARCH LAB · 1.29</div>','STOCK RESEARCH LAB · 1.30</div>'),
                  ('from history_lab_v129 import history_lab_section',
                   'from history_lab_v129 import history_lab_section\nfrom signal_validation_v130 import validation_section'),
                  ("'三大法人買賣超股數','法人資料狀態','研究訊號歷史v129',",
                   "'三大法人買賣超股數','法人資料狀態','研究訊號歷史v129','訊號同日對照v130',"),
                  ("            if merged[key].get('研究訊號歷史v129') and not row.get('研究訊號歷史v129'):\n"
                   "                row['研究訊號歷史v129']=merged[key]['研究訊號歷史v129']",
                   "            if merged[key].get('研究訊號歷史v129') and not row.get('研究訊號歷史v129'):\n"
                   "                row['研究訊號歷史v129']=merged[key]['研究訊號歷史v129']\n"
                   "            if merged[key].get('訊號同日對照v130') and not row.get('訊號同日對照v130'):\n"
                   "                row['訊號同日對照v130']=merged[key]['訊號同日對照v130']"),
                  ('    {history_lab_section(UNIVERSE, INDUSTRY, TW_NAMES, records, history_frames, benchmark_frames, history_rows)}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}',
                   '    {history_lab_section(UNIVERSE, INDUSTRY, TW_NAMES, records, history_frames, benchmark_frames, history_rows)}\n'
                   '    {validation_section(UNIVERSE, history_rows, history_frames, benchmark_frames)}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}'),
              ]
              patched=source
              for before,after in edits:
                  patched=replace_once(patched,before,after,'radar.py')
              checked=replace_once(quality,
                  "    'STOCK RESEARCH LAB · 1.29',",
                  "    'STOCK RESEARCH LAB · 1.30',\n    '🧪 台股｜訊號有效性驗證室・1.30',",
                  'site_quality.py')
              # Stop before any mutation if source or generated module cannot even compile.
              compile(patched,'radar.py','exec')
              compile(checked,'site_quality.py','exec')
              target.write_bytes(content)
              radar_path.write_text(patched,encoding='utf-8')
              quality_path.write_text(checked,encoding='utf-8')
              print('✅ 已安全升級 1.29 → 1.30；既有日曆、歷史、1.24–1.29 完全保留')
          elif version=='1.30':
              file=Path('signal_validation_v130.py')
              if (not file.is_file() or hashlib.sha256(file.read_bytes()).hexdigest()!=EXPECTED_SHA
                      or '訊號同日對照v130' not in source or
                      "'🧪 台股｜訊號有效性驗證室・1.30'" not in quality):
                  raise SystemExit('1.30 版本未通過完整性驗證：不覆寫')
              print('✅ 既有1.30模組完整；重跑不改任何檔案')
          else:
              raise SystemExit(f'偵測到股票雷達版本 {version}：只允許從1.29安全升級到1.30')
          PY_INSTALL
      - name: 保存1.30模組與版本（保留舊資料）
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py site_quality.py signal_validation_v130.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add signal effectiveness comparison v1.30'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi
      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 使用既有依賴
        run: pip install -r requirements.txt
      - name: 重新產生並驗證股票雷達
        run: python radar.py
      - name: 儲存歷史與新版網站
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish signal validity lab v1.30'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi
      - name: 準備完整 GitHub Pages 網站
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布 1.30 訊號有效性驗證研究網站
        id: publish
        uses: actions/deploy-pages@v4
