          checks=quality.read_text(encoding='utf-8')
          match=re.search(r'^"""小G 股票雷達 ([0-9.]+)：',original)
          version=match.group(1) if match else 'unknown'

          def replace_once(text, old, new, context):
              times=text.count(old)
              if times != 1:
                  raise SystemExit(f'1.27 與{context}不相容：預期1個標記，實際{times}個；已安全停止')
              return text.replace(old,new,1)

          if version == '1.26':
              patches = [
                  ('小G 股票雷達 1.26：','小G 股票雷達 1.27：'),
                  ('<title>小G股票雷達 1.26</title>', '<title>小G股票雷達 1.27</title>'),
                  ('STOCK RESEARCH LAB · 1.26</div>', 'STOCK RESEARCH LAB · 1.27</div>'),
                  ('from sector_dashboard_v126 import sector_dashboard_section',
                   'from sector_dashboard_v126 import sector_dashboard_section\nfrom sector_treasure_v127 import treasure_section'),
                  ('    {sector_dashboard_section(UNIVERSE, INDUSTRY, records, history_frames, benchmark_frames, history_rows)}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}',
                   '    {sector_dashboard_section(UNIVERSE, INDUSTRY, records, history_frames, benchmark_frames, history_rows)}\n'
                   '    {treasure_section(UNIVERSE, INDUSTRY, TW_NAMES, records, history_frames, benchmark_frames, history_rows)}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}'),
              ]
              patched=original
              for old,new in patches:
                  patched=replace_once(patched,old,new,'radar.py')
              verified=replace_once(checks,"'STOCK RESEARCH LAB · 1.26',", "'STOCK RESEARCH LAB · 1.27',",'site_quality.py')
              verified=replace_once(verified,"    '🇹🇼 台股｜產業交叉驗證總控台・1.26',\n",
                  "    '🇹🇼 台股｜產業交叉驗證總控台・1.26',\n    '🔎 台股｜產業尋寶雷達・1.27',\n",'site_quality.py')
              compile(patched,'radar.py','exec')
              compile(verified,'site_quality.py','exec')
              Path('sector_treasure_v127.py').write_bytes(content)
              radar.write_text(patched,encoding='utf-8')
              quality.write_text(verified,encoding='utf-8')
              print('✅ 1.27 安裝完成，保留 1.26 全部研究室及原有歷史')
          elif version == '1.27':
              module=Path('sector_treasure_v127.py')
              if (not module.is_file() or hashlib.sha256(module.read_bytes()).hexdigest()!=EXPECTED_SHA
                      or 'from sector_treasure_v127 import treasure_section' not in original
                      or "'🔎 台股｜產業尋寶雷達・1.27'" not in checks):
                  raise SystemExit('1.27 目前版本與模組不相符；拒絕覆寫')
              print('✅ 已安裝 1.27；安全跳過重複安裝')
          else:
              raise SystemExit(f'只能由 1.26 升級，現在是 {version}；未修改原網站')
          PY_UPGRADE
      - name: 儲存新版模組及主程式
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sector_treasure_v127.py radar.py site_quality.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add mobile sector stock explorer v1.27'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi
      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝既有依賴
        run: pip install -r requirements.txt
      - name: 驗收缺資料及法人校驗情境
        shell: bash
        run: |
          python - <<'PY_TEST'
          from radar import UNIVERSE, INDUSTRY, TW_NAMES
          from sector_treasure_v127 import treasure_section, research_rows, _verified_institution
          result = research_rows(UNIVERSE, INDUSTRY, TW_NAMES, [], {}, {}, [], [], [])
          assert result['total'] == 50
          assert len(result['groups']) == len(set(INDUSTRY[s] for s in UNIVERSE['台股']))
          page = treasure_section(UNIVERSE, INDUSTRY, TW_NAMES, [], {}, {}, [], [], [])
          assert page.count('class="treasure-stock"') == 50
          assert '🔎 台股｜產業尋寶雷達・1.27' in page
          assert _verified_institution({}) is None
          assert _verified_institution({'法人資料狀態':'官方已核對',
              '外資買賣超股數':'1000','投信買賣超股數':'500',
              '自營商買賣超股數':'0','三大法人買賣超股數':'1600'}) is None
          assert _verified_institution({'法人資料狀態':'官方已核對',
              '外資買賣超股數':'1000','投信買賣超股數':'500',
              '自營商買賣超股數':'0','三大法人買賣超股數':'1500'}) is not None
          print('✅ 50檔個股卡片、缺值標記、法人合計校驗通過')
          PY_TEST
      - name: 產生最新股票雷達並驗收
        run: python radar.py
      - name: 保存網站及原本歷史
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish stock sector explorer v1.27'
            git push || echo '::warning::其他工作流程同時推送，當次Pages仍依驗收版本發布'
          fi
      - name: 準備完整手機網站
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布 1.27 產業尋寶雷達
        id: publish
        uses: actions/deploy-pages@v4
