          module = gzip.decompress(base64.b64decode(''.join(packed.split()))).decode('utf-8')
          compile(module, 'industry_lens.py', 'exec')
          main = Path('radar.py')
          previous = main.read_text(encoding='utf-8')
          version_match = re.search(r'<div class="eyebrow">STOCK RESEARCH LAB · ([0-9.]+)</div>', previous)
          version = version_match.group(1) if version_match else None
          if version == '1.14':
              upgraded = previous
              if 'from industry_lens import industry_lens_section' not in previous:
                  raise SystemExit('版本標示 1.14 但缺少模組連結，為安全起見停止')
              print('1.14 已經安裝，保持現有主程式')
          elif version == '1.13':
              patches = [
                  ('from industry_readiness import industry_readiness_section',
                   'from industry_readiness import industry_readiness_section\nfrom industry_lens import industry_lens_section'),
                  ('    {monthly_revenue_section(UNIVERSE, INDUSTRY, TW_NAMES)}',
                   '    {monthly_revenue_section(UNIVERSE, INDUSTRY, TW_NAMES)}\n    {industry_lens_section(UNIVERSE, INDUSTRY, TW_NAMES, records)}'),
                  ('小G 股票雷達 1.13：', '小G 股票雷達 1.14：'),
                  ('小G股票雷達 1.13', '小G股票雷達 1.14'),
                  ('STOCK RESEARCH LAB · 1.13', 'STOCK RESEARCH LAB · 1.14'),
              ]
              upgraded = previous
              for before, after in patches:
                  if upgraded.count(before) != 1:
                      raise SystemExit('主程式插入點不符合預期：'+before[:65])
                  upgraded = upgraded.replace(before, after, 1)
              # The existing 1.13 weekly archive job detects versions by substring.
              # Keeping the legacy marker prevents it from trying to reinstall 1.13.
              if '# STOCK RESEARCH LAB · 1.13' not in upgraded:
                  upgraded += '\n# STOCK RESEARCH LAB · 1.13\n'
              compile(upgraded, 'radar.py', 'exec')
          else:
              raise SystemExit('只允許從 1.13 升級；現在偵測到 '+str(version)+'，停止保護原雷達')

          Path('industry_lens.py').write_text(module, encoding='utf-8')
          if upgraded != previous:
              main.write_text(upgraded, encoding='utf-8')
          print('1.14 產業透視鏡安裝成功。原有掃描、排行與分頁不變。')
          PY_UPGRADE

      - name: 保存程式（不修改任何既有 workflow）
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py industry_lens.py
          if ! git diff --cached --quiet; then
            git commit -m 'Radar 1.14: drill down TW industry revenue and profitability'
            git push
          fi

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝原有工具
        run: pip install -r requirements.txt

      - name: 執行股票雷達與產業透視鏡
        run: python radar.py

      - name: 保存報告與既有財報資料
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          for path in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update radar 1.14 report and official archives'
            git push
          fi

      - name: 準備手機網站
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for path in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$path" ]; then cp "$path" "_site/$path"; fi
          done

      - name: 上傳網頁
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布小G股票雷達 1.14
        id: publish
        uses: actions/deploy-pages@v4
