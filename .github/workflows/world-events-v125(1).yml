                  ('小G 股票雷達 1.24：','小G 股票雷達 1.25：'),
                  ('<title>小G股票雷達 1.24</title>','<title>小G股票雷達 1.25</title>'),
                  ('STOCK RESEARCH LAB · 1.24</div>','STOCK RESEARCH LAB · 1.25</div>'),
                  ('from institutional_flow import institutional_section',
                   'from institutional_flow import institutional_section\nfrom world_events_v125 import official_events_section'),
                  ('    {institutional_section(UNIVERSE, INDUSTRY, history_rows, records)}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}',
                   '    {institutional_section(UNIVERSE, INDUSTRY, history_rows, records)}\n'
                   '    {official_events_section()}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}'),
                  ('國際新聞<small>尚未接入</small>',
                   '國際新聞<small>已接入官方公告觀察；15分評分尚未啟用</small>'),
                  ('國際新聞尚未接入。',
                   '國際新聞目前只顯示部分國際官方公告，不提供15分評分。')
              ]
              updated=original
              for a,b in changes:
                  updated=replace_once(updated,a,b)
              qc=replace_once(checks,"'STOCK RESEARCH LAB · 1.24',",
                              "'STOCK RESEARCH LAB · 1.25',")
              qc=replace_once(qc,"    '🇹🇼 台股｜法人買賣超研究室・1.24',",
                              "    '🇹🇼 台股｜法人買賣超研究室・1.24',\n"
                              "    '📰 國際重大事件觀察室・1.25',")
              compile(updated,'radar.py','exec')
              compile(qc,'site_quality.py','exec')
              # Only modify disk after all replacements and syntax checks succeed.
              Path('world_events_v125.py').write_text(code,encoding='utf-8')
              quality.write_text(qc,encoding='utf-8')
              radar.write_text(updated,encoding='utf-8')
              print('✅ 1.25 國際事件觀察室已安裝，既有法人/技術/產業/廚房保持不變')
          elif version=='1.25':
              if 'from world_events_v125 import official_events_section' not in original or \
                      '📰 國際重大事件觀察室・1.25' not in checks:
                  raise SystemExit('1.25 既有安裝不完整，停止以免覆蓋')
              target=Path('world_events_v125.py')
              if not target.exists():
                  target.write_text(code,encoding='utf-8')
              print('✅ 已是 1.25；重複執行不會插入第二次')
          else:
              raise SystemExit('目前版本 '+version+'；僅允許 1.24 升級或重跑 1.25，拒絕覆寫')

          PY_UPGRADE

      - name: 保存程式模組與版本
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py site_quality.py world_events_v125.py
          if ! git diff --cached --quiet; then
            git commit -m 'Install stock radar v1.25 official events observer'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝原有股票研究依賴
        run: pip install -r requirements.txt

      - name: 產生並驗收完整股票研究網站
        run: python radar.py

      - name: 保存研究網站與原有歷史
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated stock radar v1.25'
            git push || echo '::warning::儲存競爭衝突，請檢查後續每日自動更新是否保存成功'
          fi

      - name: 準備手機靜態網站
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done

      - name: 上傳已驗收的網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布股票研究別墅 1.25
        id: publish
        uses: actions/deploy-pages@v4
