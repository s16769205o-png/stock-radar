name: 小G股票雷達 1.25｜國際重大事件觀察室

on:
  push:
    paths:
      # 手機下載的檔名有時會被附加 (1)；兩種情況都可觸發。
      - '.github/workflows/world-events-v125*.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-world-events-v125
  cancel-in-progress: false

