name: 小G股票雷達 1.26｜產業交叉驗證總控台

on:
  push:
    paths:
      - '.github/workflows/sector-cross-v126*.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-sector-cross-v126
  cancel-in-progress: false

