          EXPECTED_SHA = '8825babd8502341369e076b51d1a872ad52d7c956c55b1aeca97e2a652bf731c'
          content = gzip.decompress(base64.b64decode(''.join(MODULE_B64.split())))
          if hashlib.sha256(content).hexdigest() != EXPECTED_SHA:
              raise SystemExit('1.26 模組校驗失敗；停止安裝，原網站不變')
          compile(content.decode('utf-8'), 'sector_dashboard_v126.py', 'exec')
          radar = Path('radar.py')
          quality = Path('site_quality.py')
          news = Path('world_events_v125.py')
          if any(not f.is_file() for f in (radar, quality, news)):
              raise SystemExit('找不到 1.25 必要程式；不覆蓋檔案')
          original = radar.read_text(encoding='utf-8')
          checks = quality.read_text(encoding='utf-8')
          feed = news.read_text(encoding='utf-8')
          match = re.search(r'^\"\"\"小G 股票雷達 ([0-9.]+)：', original)
          version = match.group(1) if match else 'unknown'
          
          
          def replace_once(source, old, new, name):
              n = source.count(old)
              if n != 1:
                  raise SystemExit(f'1.26 安裝器與{name}不相容（標記出現{n}次），已安全停止：{old[:70]}')
              return source.replace(old, new, 1)
          
          
          if version == '1.25':
              edits = [
                  ('小G 股票雷達 1.25：','小G 股票雷達 1.26：'),
                  ('<title>小G股票雷達 1.25</title>','<title>小G股票雷達 1.26</title>'),
                  ('STOCK RESEARCH LAB · 1.25</div>','STOCK RESEARCH LAB · 1.26</div>'),
                  ('from institutional_flow import institutional_section',
                   'from institutional_flow import institutional_section\nfrom sector_dashboard_v126 import sector_dashboard_section'),
                  ('    {official_events_section()}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}',
                   '    {official_events_section()}\n'
                   '    {sector_dashboard_section(UNIVERSE, INDUSTRY, records, history_frames, benchmark_frames, history_rows)}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}'),
              ]
              patched = original
              for old,new in edits:
                  patched = replace_once(patched, old,new,'radar.py')
              verified = replace_once(checks, "'STOCK RESEARCH LAB · 1.25',",
                 "'STOCK RESEARCH LAB · 1.26',\n    '🇹🇼 台股｜產業交叉驗證總控台・1.26',",'site_quality.py')
              # A dated official link with an empty article id is not a useful source.
              link_old = """    if p.username or p.password or len(url) > 1600:
                  return None
              return url"""
              link_new = """    if p.username or p.password or len(url) > 1600:
                  return None
              if (permitted_domain == 'eia.gov' and p.path.endswith('/todayinenergy/detail.php')
                      and not any(v.isdigit() for v in urllib.parse.parse_qs(p.query).get('id', []))):
                  return None
              return url"""
              safer_feed = replace_once(feed, link_old, link_new, 'world_events_v125.py')
              # Compile every output before modifying any repository source file.
              for path,source in (('radar.py',patched),('site_quality.py',verified),('world_events_v125.py',safer_feed)):
                  compile(source,path,'exec')
              (Path('sector_dashboard_v126.py')).write_bytes(content)
              radar.write_text(patched,encoding='utf-8')
              quality.write_text(verified,encoding='utf-8')
              news.write_text(safer_feed,encoding='utf-8')
              print('✅ 1.26 dashboard, security check and news-link validation installed')
          elif version == '1.26':
              if ('from sector_dashboard_v126 import sector_dashboard_section' not in original
                      or "'🇹🇼 台股｜產業交叉驗證總控台・1.26'" not in checks):
                  raise SystemExit('1.26 不完整：拒絕覆寫現有網站')
              file = Path('sector_dashboard_v126.py')
              if not file.is_file() or hashlib.sha256(file.read_bytes()).hexdigest() != EXPECTED_SHA:
                  raise SystemExit('1.26 模組不相容：停止覆寫，請檢查既有修改')
              print('✅ 已是完整的 1.26，重跑不修改既有檔案')
          else:
              raise SystemExit(f'版本 {version} 不支援此安裝器；只允許 1.25 升 1.26')
          PY_UPGRADE
      - name: 安全保存模組與版本
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py site_quality.py world_events_v125.py sector_dashboard_v126.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified sector evidence dashboard v1.26'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi
      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝原有依賴
        run: pip install -r requirements.txt
      - name: 重新產生並驗收別墅網頁
        run: python radar.py
      - name: 保存研究頁面與原本歷史
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish sector research dashboard v1.26'
            git push || echo '::warning::其他工作流程同時推送；當次 Pages 仍依驗收結果發布'
          fi
      - name: 準備完整手機網站
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布 1.26 產業交叉研究網站
        id: publish
        uses: actions/deploy-pages@v4
