          compile(source, 'industry_briefs.py', 'exec')
          radar_path = Path('radar.py')
          radar = radar_path.read_text(encoding='utf-8')
          if 'STOCK RESEARCH LAB · 1.15' in radar:
              if 'from industry_briefs import add_industry_briefs' not in radar:
                  raise SystemExit('版本標記與程式不一致，停止變更')
              updated = radar
              print('1.15 已安裝，維持版本不變')
          else:
              if radar.count('STOCK RESEARCH LAB · 1.14') != 1:
                  raise SystemExit('原程式不是預期的 1.14 版，停止以保護歷史資料')
              patches = [
                  ('from industry_lens import industry_lens_section',
                   'from industry_lens import industry_lens_section\nfrom industry_briefs import add_industry_briefs'),
                  ('    install_mobile_tabs(SITE_FILE)',
                   '    add_industry_briefs(SITE_FILE, UNIVERSE, INDUSTRY, records)\n    install_mobile_tabs(SITE_FILE)'),
                  ('小G 股票雷達 1.14：', '小G 股票雷達 1.15：'),
                  ('小G股票雷達 1.14', '小G股票雷達 1.15'),
                  ('STOCK RESEARCH LAB · 1.14', 'STOCK RESEARCH LAB · 1.15'),
                  ('台股50＋美股50｜產業資料可比性、營收、獲利、技術排名及績效追蹤',
                   '台股50＋美股50｜產業一句話、營收、獲利、技術排名及績效追蹤'),
              ]
              updated = radar
              for before, after in patches:
                  if updated.count(before) != 1:
                      raise SystemExit('插入點不唯一，停止保護原程式：'+before[:65])
                  updated = updated.replace(before, after, 1)
              compile(updated, 'radar.py', 'exec')
          # Only change Python files. Never touch .github/workflows/radar.yml.
          Path('industry_briefs.py').write_text(source, encoding='utf-8')
          if updated != radar:
              radar_path.write_text(updated, encoding='utf-8')
          print('1.15 module and scanner installed successfully')
          PY_UPGRADE

      - name: 保存程式更新（不推送既有工作流程）
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py industry_briefs.py
          if ! git diff --cached --quiet; then
            git commit -m 'Install 1.15 evidence-led industry briefs'
            git push
          fi

      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝雷達原有工具
        run: pip install -r requirements.txt

      - name: 更新股票雷達與產業一句話
        run: python radar.py

      - name: 保存報告與已擷取歷史資料
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          for f in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh 1.15 radar and sector brief snapshots'
            git push
          fi

      - name: 整理手機網站
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done

      - name: 上傳網站報告
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: install
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布股票雷達1.15
        id: publish
        uses: actions/deploy-pages@v4
