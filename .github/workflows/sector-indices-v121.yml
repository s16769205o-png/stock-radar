name: 小G股票雷達 1.21｜產業指數觀景台

on:
  push:
    paths:
      # 接受手機下載加上的 (1) 等檔名後綴
      - '.github/workflows/sector-indices-v121*.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-sector-indices-v121
  cancel-in-progress: false

