              ]
              updated=before
              for old,new in changes:
                  if updated.count(old) != 1:
                      raise SystemExit('版本插入位置不符合預期：'+old[:50])
                  updated=updated.replace(old,new,1)
              compile(updated,'radar.py','exec')
              Path('sector_indices.py').write_text(text,encoding='utf-8')
              path.write_text(updated,encoding='utf-8')
              print('1.21 官方台股產業指數與美股產業 ETF 觀景台已安裝')
          elif current == '1.21':
              if not Path('sector_indices.py').exists():
                  Path('sector_indices.py').write_text(text,encoding='utf-8')
              print('已是 1.21，不重複修改既有頁面')
          else:
              raise SystemExit('目前是版本 '+current+'；只允許由 1.20 升級或重跑 1.21')
          PY_UPGRADE

      - name: 保存新程式（不改原本每日自動掃描排程）
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py sector_indices.py
          if ! git diff --cached --quiet; then
            git commit -m 'Install Stock Radar 1.21 sector index observatory'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 安裝現有 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝股票雷達既有依賴
        run: pip install -r requirements.txt

      - name: 更新行情報告與產業指數觀景台
        run: python radar.py

      - name: 保存新報告與既有歷史
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          for f in data/monthly_revenue.csv data/quarterly_profit.csv data/berkshire_13f.json data/maintenance_status.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Stock Radar 1.21 market snapshot'
            git push || echo '::warning::與其他排程同時更新，歷史資料推送衝突；仍保留本次網頁發布'
          fi

      - name: 準備手機網站
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done

      - name: 上傳網站成品
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布 1.21 產業指數觀景台
        id: publish
        uses: actions/deploy-pages@v4
