              ('小G股票雷達 1.10', '小G股票雷達 1.11'),
              ('STOCK RESEARCH LAB · 1.10', 'STOCK RESEARCH LAB · 1.11'),
          ]:
                  if updated.count(old)!=1:
                      raise SystemExit('原程式出現非預期變化，停止升級：'+old[:55])
                  updated=updated.replace(old,new,1)
              # The previously installed weekly official-data archive workflows check for
              # these exact legacy feature markers before refreshing snapshots. Retain
              # them as explicit compatibility comments, *not* as the current UI version.
              updated += ("\n# Legacy weekly archive compatibility (features present; not the current version):\n"
                          "# STOCK RESEARCH LAB · 1.9\n"
                          "# STOCK RESEARCH LAB · 1.10\n")
              compile(updated, 'radar.py', 'exec')
          Path('fundamental_crosscheck.py').write_text(mod,encoding='utf-8')
          if updated != original:
              source_path.write_text(updated,encoding='utf-8')
          print('已安裝 1.11 基本面交叉研究室；未修改任何現有工作流程')
          PY_INSTALL
      - name: 保存新版程式（不修改工作流程）
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py fundamental_crosscheck.py
          if ! git diff --cached --quiet; then
            git commit -m 'Radar v1.11: cross-check revenue growth and operating profit'
            git push
          fi
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝原本工具
        run: pip install -r requirements.txt
      - name: 更新股票雷達網頁
        run: python radar.py
      - name: 保存掃描及研究快照
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if [ -f data/monthly_revenue.csv ]; then git add data/monthly_revenue.csv; fi
          if [ -f data/quarterly_profit.csv ]; then git add data/quarterly_profit.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update v1.11 research report and captured filings'
            git push
          fi
      - name: 準備網站
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          if [ -f data/monthly_revenue.csv ]; then cp data/monthly_revenue.csv _site/data/monthly_revenue.csv; fi
          if [ -f data/quarterly_profit.csv ]; then cp data/quarterly_profit.csv _site/data/quarterly_profit.csv; fi
      - name: 上傳網頁資料
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: install
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布 1.11 網站
        id: publish
        uses: actions/deploy-pages@v4
