          original = source_path.read_text(encoding='utf-8')
          if 'STOCK RESEARCH LAB · 1.11' in original:
              print('1.11 已安裝：不重複修改雷達主程式')
              updated=original
          else:
              if original.count('STOCK RESEARCH LAB · 1.10') != 1:
                  raise SystemExit('主程式版本不是已驗證的 1.10；為保護舊系統停止升級')
