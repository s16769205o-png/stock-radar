    paths:
      - '.github/workflows/readiness-v113.yml'
  workflow_dispatch:
  schedule:
    # 台灣時間每週日15:20。官方月營收與季度財報保留新快照。
    - cron: '20 7 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-readiness-v113
  cancel-in-progress: false

