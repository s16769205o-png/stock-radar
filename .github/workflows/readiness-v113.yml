      - name: 保存1.13程式
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py industry_readiness.py
          if ! git diff --cached --quiet; then
            git commit -m 'Radar 1.13: industry fundamentals data readiness'
            git push
          fi
      - name: 設定Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝工具
        run: pip install -r requirements.txt
      - name: 更新雷達與已發布財報快照
        run: python radar.py
      - name: 保存報告與兩種財報歷史檔
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          for path in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update v1.13 report and archived fundamentals'
            git push
          fi
      - name: 準備手機網頁
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for path in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$path" ]; then cp "$path" _site/data/; fi
          done
      - name: 上傳網頁
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: upgrade
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布股票雷達1.13
        id: publish
        uses: actions/deploy-pages@v4
