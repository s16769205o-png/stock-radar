          content = gzip.decompress(base64.b64decode(''.join(MODULE_B64.split())))
          if hashlib.sha256(content).hexdigest() != EXPECTED_SHA:
              raise SystemExit('1.28 模組校驗不符：安全停止，不更改原網站')
          compile(content.decode('utf-8'), 'sector_diagnostics_v128.py', 'exec')
          radar = Path('radar.py')
          quality = Path('site_quality.py')
          prev_module = Path('sector_treasure_v127.py')
          if not all(f.is_file() for f in (radar,quality,prev_module,Path('sector_dashboard_v126.py'))):
              raise SystemExit('缺少1.27既有程式，停止安裝')
          original = radar.read_text(encoding='utf-8')
          checks = quality.read_text(encoding='utf-8')
          m = re.search(r'^"""小G 股票雷達 ([0-9.]+)：',original)
          version = m.group(1) if m else 'unknown'

          def once(source, old, new, target):
              n=source.count(old)
              if n != 1:
                  raise SystemExit(f'{target}找到{n}個升級標記（預期1個），拒絕覆寫舊檔')
              return source.replace(old,new,1)

          if version == '1.27':
              patches = [
                  ('小G 股票雷達 1.27：', '小G 股票雷達 1.28：'),
                  ('<title>小G股票雷達 1.27</title>', '<title>小G股票雷達 1.28</title>'),
                  ('STOCK RESEARCH LAB · 1.27</div>', 'STOCK RESEARCH LAB · 1.28</div>'),
                  ('from sector_treasure_v127 import treasure_section',
                   'from sector_treasure_v127 import treasure_section\nfrom sector_diagnostics_v128 import diagnostics_section'),
                  ('    {treasure_section(UNIVERSE, INDUSTRY, TW_NAMES, records, history_frames, benchmark_frames, history_rows)}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}',
                   '    {treasure_section(UNIVERSE, INDUSTRY, TW_NAMES, records, history_frames, benchmark_frames, history_rows)}\n'
                   '    {diagnostics_section(UNIVERSE, INDUSTRY, TW_NAMES, records, history_frames, benchmark_frames, history_rows)}\n'
                   '    {health_section(records,errors,history_rows,UNIVERSE,INDUSTRY)}'),
              ]
              patched = original
              for old,new in patches:
                  patched = once(patched,old,new,'radar.py')
              verified = once(checks,"'STOCK RESEARCH LAB · 1.27',", "'STOCK RESEARCH LAB · 1.28',",'site_quality.py')
              verified = once(verified,"    '🔎 台股｜產業尋寶雷達・1.27',\n",
                              "    '🔎 台股｜產業尋寶雷達・1.27',\n    '🧭 台股｜異常原因排查室・1.28',\n",'site_quality.py')
              compile(patched,'radar.py','exec')
              compile(verified,'site_quality.py','exec')
              Path('sector_diagnostics_v128.py').write_bytes(content)
              radar.write_text(patched,encoding='utf-8')
              quality.write_text(verified,encoding='utf-8')
              print('✅ 完成1.28安裝，1.24–1.27與資料都保留')
          elif version == '1.28':
              current = Path('sector_diagnostics_v128.py')
              if (not current.is_file() or hashlib.sha256(current.read_bytes()).hexdigest()!=EXPECTED_SHA
                  or 'from sector_diagnostics_v128 import diagnostics_section' not in original
                  or "'🧭 台股｜異常原因排查室・1.28'" not in checks):
                  raise SystemExit('1.28 檔案不相符，拒絕覆寫')
              print('✅ 已完整安裝1.28，避免重複覆寫')
          else:
              raise SystemExit(f'只能從1.27升級；發現 {version}，已安全停止')
          PY_UPGRADE
      - name: 儲存新版模組與主程式
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sector_diagnostics_v128.py radar.py site_quality.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add anomaly evidence checklist v1.28'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi
      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝既有依賴
        run: pip install -r requirements.txt
      - name: 驗收安全計算與缺資料情境
        shell: bash
        run: |
          python - <<'PY_TEST'
          import pandas as pd
          from radar import UNIVERSE, INDUSTRY, TW_NAMES
          from sector_diagnostics_v128 import diagnose, diagnostics_section, _official_5day
          from datetime import datetime
          empty=diagnose(UNIVERSE,INDUSTRY,TW_NAMES,[],{},{},[],[],[])
          assert empty['count']==0 and empty['groups']==[]
          assert '🧭 台股｜異常原因排查室・1.28' in diagnostics_section(UNIVERSE,INDUSTRY,TW_NAMES,[],{},{},[],[],[])
          dates=pd.bdate_range(end='2026-11-20',periods=30)
          frame=lambda last:pd.DataFrame({'Close':[100.] * 29 + [float(last)]},index=dates)
          code='3532.TW'
          r=[{'市場':'台股','股票':code,'交易日期':'2026-11-20'}]
          m=[{'公司代號':'3532','資料年月':'2026-10','年增率':'28.8','累計年增率':'5.0'}]
          q=[{'公司代號':'3532','季度':'2026Q3','累計營業利益率%':'2.2'},
             {'公司代號':'3532','季度':'2025Q3','累計營業利益率%':'9.0'}]
          days=['2026-11-20','2026-11-19','2026-11-18','2026-11-17','2026-11-16']
          h=[{'市場':'台股','股票':code,'交易日期':d,'法人資料狀態':'官方已核對',
              '外資買賣超股數':'-1000','投信買賣超股數':'0','自營商買賣超股數':'0',
              '三大法人買賣超股數':'-1000'} for d in days]
          data=diagnose(UNIVERSE,INDUSTRY,TW_NAMES,r,{code:frame(70)},
                        {'台股':frame(95)},h,m,q)
          assert data['count']==1, data['count']
          stock=next(c for g in data['groups'] for c in g['stocks'])
          assert stock['relative'] < -20 and abs(stock['margin_delta']+6.8)<1e-8
          assert stock['flow5']==-5000 and stock['accumulated_yoy']==5
          assert '查公司公告' in '；'.join(stock['checklist'])
          assert _official_5day(h[:-1],code,'2026-11-20')[0] is None
          page=diagnostics_section(UNIVERSE,INDUSTRY,TW_NAMES,r,{code:frame(70)},
                                   {'台股':frame(95)},h,m,q)
          assert '台勝科' in page and '-5.00 張' in page
          print('✅ 1.28 缺值、20日比較、跨期獲利、法人5日及顯示測試完成')
          PY_TEST
      - name: 重新產生並完整驗收網站
        run: python radar.py
      - name: 保存研究網站與原本歷史
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish anomaly evidence checklist v1.28'
            git push || echo '::warning::可能有其他工作流程同時提交；本次Pages仍依驗收內容發布'
          fi
      - name: 準備完整手機及電腦網站
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布 1.28 研究排查室
        id: publish
        uses: actions/deploy-pages@v4
