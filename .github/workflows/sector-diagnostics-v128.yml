name: 小G股票雷達 1.28｜異常原因排查室

on:
  push:
    paths:
      - '.github/workflows/sector-diagnostics-v128.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-sector-diagnostics-v128
  cancel-in-progress: false

