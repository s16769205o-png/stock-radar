                  modified=modified.replace(before,after,1)
              if 'from system_health import health_section' not in modified:
                  raise SystemExit('1.17 健康燈未安裝，停止升級')
              compile(modified, 'radar.py','exec')
              Path('famous_13f.py').write_text(module,encoding='utf-8')
              path.write_text(modified,encoding='utf-8')
              print('1.19 名人持股室程式已安全安裝；舊五個分頁與私人資料不變')
          elif current=='1.19':
              if not Path('famous_13f.py').exists():
                  Path('famous_13f.py').write_text(module,encoding='utf-8')
              print('重複執行：已是 1.19，不重複改動雷達')
          else:
              raise SystemExit(f'目前版本 {current}，只能從 1.18 安裝或重跑 1.19；防止覆蓋未知版本')
          PY_UPGRADE

      - name: 儲存新模組與版號
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py famous_13f.py
          if ! git diff --cached --quiet; then
            git commit -m 'Install v1.19 Berkshire 13F holdings room'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 查詢 SEC 官方 13F（失敗不編造資料）
        shell: bash
        run: |
          python famous_13f.py --refresh

      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝股票雷達現有依賴
        run: pip install -r requirements.txt

      - name: 產生新版五房間網站
        run: python radar.py

      - name: 保存官方申報快照與掃描歷史
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          for f in data/monthly_revenue.csv data/quarterly_profit.csv data/berkshire_13f.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update v1.19 SEC 13F and radar snapshots'
            git push || echo '::warning::同時更新造成 Git 推送衝突；仍可發布本次網站，請確認後續自動存檔'
          fi

      - name: 整理靜態網站
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done

      - name: 上傳 GitHub Pages 網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布小G股票雷達 1.19
        id: publish
        uses: actions/deploy-pages@v4
