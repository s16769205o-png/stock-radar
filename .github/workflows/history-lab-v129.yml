              print('✅ 已經是完整的 1.29，重跑不覆蓋歷史')
          else:
              raise SystemExit(f'安裝器只支援 1.28 升 1.29，目前為 {version}')
          PY_UPGRADE
      - name: 保存新模組與歷史存檔欄位
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py site_quality.py history_lab_v129.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add forward-only signal evidence archive v1.29'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi
      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝既有工具
        run: pip install -r requirements.txt
      - name: 產生新版股票雷達與訊號存檔
        run: python radar.py
      - name: 驗證歷史 CSV 新欄位與事件一致性
        shell: bash
        run: |
          python - <<'PY_CHECK'
          import csv,json
          from pathlib import Path
          from history_lab_v129 import ARCHIVE_FIELD, KINDS, _load
          path=Path('data/history.csv')
          if not path.is_file():
              raise SystemExit('歷史 CSV 不存在，拒絕發佈')
          with path.open(encoding='utf-8-sig',newline='') as f:
              reader=csv.DictReader(f)
              if ARCHIVE_FIELD not in (reader.fieldnames or ()):
                  raise SystemExit('新歷史欄位尚未寫入，拒絕發佈')
              items=list(reader)
          events=_load(items)
          if len(events)!=len(set((e['price_day'],e['symbol'],e['kind']) for e in events)):
              raise SystemExit('發現重複訊號，拒絕發佈')
          page=Path('index.html').read_text(encoding='utf-8')
          if '🗂️ 台股｜歷史訊號與可信度研究室・1.29' not in page:
              raise SystemExit('新版研究頁面遺失，拒絕發佈')
          print('✅ 1.29 研究頁與原歷史存檔通過驗收，事件',len(events),'筆')
          PY_CHECK
      - name: 保存網頁與原有歷史 CSV
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish history signal laboratory v1.29'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi
      - name: 準備網站與歷史 CSV
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布 1.29 歷史訊號研究室
        id: publish
        uses: actions/deploy-pages@v4
