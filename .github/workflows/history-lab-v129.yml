                             'radar.py FIELDS')
              r=swap_once(r,"                    row[field]=merged[key][field]\n        merged[key]=row",
                             "                    row[field]=merged[key][field]\n"
                             "            if merged[key].get('研究訊號歷史v129') and not row.get('研究訊號歷史v129'):\n"
                             "                row['研究訊號歷史v129']=merged[key]['研究訊號歷史v129']\n"
                             "        merged[key]=row",'radar.py persist')
              for p,t in ((radar,r),(quality,q)):
                  compile(t,str(p),'exec')
              if module.exists() and hashlib.sha256(module.read_bytes()).hexdigest()!=EXPECTED_SHA:
                  raise SystemExit('發現不同內容的 history_lab_v129.py：停止覆寫')
              # Stage everything and only then replace source files.
              staged=[]
              for path,b in ((module,content),(radar,r.encode('utf-8')),(quality,q.encode('utf-8'))):
                  tmp=path.with_name(path.name+'.v129.new')
                  tmp.write_bytes(b)
                  staged.append((tmp,path))
              for tmp,path in staged:
                  tmp.replace(path)
              print('✅ 1.29 模組、每日存檔流程及版號已安全安裝')
          elif version=='1.29':
              if (not module.is_file() or hashlib.sha256(module.read_bytes()).hexdigest()!=EXPECTED_SHA
                      or 'from history_lab_v129 import history_lab_section' not in r
                      or '🗂️ 台股｜歷史訊號與可信度研究室・1.29' not in q
                      or "'研究訊號歷史v129'" not in r):
