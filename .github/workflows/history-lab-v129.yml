          version=match.group(1) if match else 'unknown'


          def swap_once(source,old,new,label):
              count=source.count(old)
              if count!=1:
                  raise SystemExit(f'1.29 與{label}不相容：標記出現{count}次；不修改舊站 ({old[:75]})')
