                      present=Path(name).read_text(encoding='utf-8')
                      if present!=source:
                          raise SystemExit('現有 '+name+' 與施工版本不一致，不自動覆蓋')
                  else:
                      Path(name).write_text(source,encoding='utf-8')
              print('✅ 已是 1.23，重複執行不會再次修改舊檔')
          PY_UPGRADE

      - name: 儲存研究模組與版號
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py site_quality.py market_health_v123.py sector_evidence_v123.py
          if ! git diff --cached --quiet; then
            git commit -m 'Install v1.23 sector evidence and US date diagnostics'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝原有行情研究工具
        run: pip install -r requirements.txt
      - name: 產生新版別墅並執行網站完整性驗收
        run: python radar.py

      - name: 保存驗收後的網頁與歷史觀察
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh stock radar v1.23 validated report'
            git push || echo '::warning::同期掃描寫入導致衝突；本次仍可發布，歷史資料請以遠端主線為準'
          fi

      - name: 準備手機網站
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳網站成品
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布股票研究別墅 1.23
        id: publish
        uses: actions/deploy-pages@v4
