name: 小G股票雷達 1.23｜美股行情診斷與產業引擎地基

on:
  push:
    paths:
      - '.github/workflows/foundation-v123*.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-foundation-v123
  cancel-in-progress: false

