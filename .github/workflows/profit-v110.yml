                  ('台股50＋美股50｜產業動能、月營收、排名變動、績效追蹤、風險提示',
                   '台股50＋美股50｜產業動能、月營收、季報獲利、排名變動、績效追蹤、風險提示'),
                  ('小G 股票雷達 1.9：', '小G 股票雷達 1.10：'),
                  ('小G股票雷達 1.9', '小G股票雷達 1.10'),
                  ('STOCK RESEARCH LAB · 1.9', 'STOCK RESEARCH LAB · 1.10'),
              ]
              new = old
              for before,after in patches:
                  found = new.count(before)
                  if found != 1:
                      raise SystemExit('預期插入點不唯一（'+str(found)+'）：'+before[:65])
                  new = new.replace(before,after,1)
              compile(new,'radar.py','exec')
