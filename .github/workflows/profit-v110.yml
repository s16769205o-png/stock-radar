      - name: 保存程式（不修改既有 GitHub 工作流程檔）
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py profitability.py
          if ! git diff --cached --quiet; then
            git commit -m 'Radar v1.10: official profit quality observations'
            git push
          fi
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝工具
        run: pip install -r requirements.txt
      - name: 執行股票雷達與財報研究
        run: python radar.py
      - name: 保存歷史資料與新報告
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data
          git add index.html data/history.csv data/quarterly_profit.csv
          if [ -f data/monthly_revenue.csv ]; then git add data/monthly_revenue.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Archive v1.10 profitability and radar report'
            git push
          fi
      - name: 準備手機網站
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          cp data/quarterly_profit.csv _site/data/quarterly_profit.csv
          if [ -f data/monthly_revenue.csv ]; then cp data/monthly_revenue.csv _site/data/monthly_revenue.csv; fi
      - name: 上傳網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  publish:
    needs: upgrade
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布股票雷達1.10
        id: publish
        uses: actions/deploy-pages@v4
