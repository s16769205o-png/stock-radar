          workflow_file = Path('.github/workflows/radar.yml')
          radar = radar_file.read_text(encoding='utf-8')
          workflow = workflow_file.read_text(encoding='utf-8')
          if 'STOCK RESEARCH LAB · 1.9' in radar:
              print('1.9 已安裝過；不再重複修改主程式')
          else:
