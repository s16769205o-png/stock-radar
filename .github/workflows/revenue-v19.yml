                  raise SystemExit('不是已驗證 1.8 版，停止升級以保護原報告')
              patches = [
                  ('import yfinance as yf',
                   'import yfinance as yf\nfrom revenue import monthly_revenue_section'),
                  ('    {industry_strength_section(records,history_frames,benchmark_frames)}',
