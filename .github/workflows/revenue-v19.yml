                  ('STOCK RESEARCH LAB · 1.8', 'STOCK RESEARCH LAB · 1.9'),
              ]
              for old, new in patches:
                  if radar.count(old) != 1:
                      raise SystemExit(f'不符合預期：{old[:55]}，找到 {radar.count(old)} 次；未修改主程式')
                  radar = radar.replace(old, new, 1)
              compile(radar,'radar.py','exec')
          # Change the existing scheduled scanner to persist the new file and publish it.
          for old, new in [
              ('git add index.html data/history.csv',
               'git add index.html data/history.csv data/monthly_revenue.csv'),
              ('cp data/history.csv _site/data/history.csv',
               'cp data/history.csv _site/data/history.csv\n          cp data/monthly_revenue.csv _site/data/monthly_revenue.csv'),
          ]:
              if new in workflow:
                  continue
              if workflow.count(old) != 1:
                  raise SystemExit(f'原定時排程格式已改變：{old}；停止升級')
              workflow = workflow.replace(old, new, 1)
          # Write only after validations are all complete.
          Path('revenue.py').write_text(new_module, encoding='utf-8')
          radar_file.write_text(radar, encoding='utf-8')
          workflow_file.write_text(workflow, encoding='utf-8')
          print('月營收研究室 1.9 安裝完成，語法驗證通過')
          PY
      - name: 保存升級後的檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.py revenue.py .github/workflows/radar.yml
          if ! git diff --cached --quiet; then
            git commit -m "Radar v1.9: official TWSE monthly revenue study"
            git push
          fi
      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝原本工具
        run: pip install -r requirements.txt
      - name: 執行股票掃描與月營收分析
        run: python radar.py
      - name: 保存最新掃描與月營收歷史
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/history.csv data/monthly_revenue.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update v1.9 radar and revenue archive"
            git push
          fi
      - name: 準備網站
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          cp data/monthly_revenue.csv _site/data/monthly_revenue.csv
      - name: 上傳網頁成品
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: upgrade
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布雷達 1.9
        id: publish
        uses: actions/deploy-pages@v4
