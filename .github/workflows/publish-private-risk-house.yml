name: 發布獨立持股風控屋

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "holdings-risk.html"
      - "risk_house_v1.js"
      - "risk_house_release.py"
      - ".github/workflows/publish-private-risk-house.yml"

# Coordinate with regular market-data publisher to avoid deploying over a scan.
concurrency:
  group: stock-radar-daily-publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out approved public code and latest report
        uses: actions/checkout@v4
      - name: Prepare existing report + private app without rescanning stocks
        run: |
          node --check risk_house_v1.js
          python risk_house_release.py
          test -s _site/index.html
          test -s _site/holdings-risk.html
          test -s _site/risk_house_v1.js
      - name: Publish static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish private holdings tool to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
