                    qM779esHaD0bWkEw3AND/XN9Bty9BXd/O0yNSU/a93aXQmr+msIyS6gejMdzWNV9eR/FhJ/e3XX3+bx/WPDpa+5MeavP3MpzZM+d
                    3nYP9r3dR97GtlddbVZ/bL363p2pIoh/AGUUW9uBBwAA
                    '''),
          }
          
          def unpack(module,expected,packed):
              data=gzip.decompress(base64.b64decode(''.join(packed.split())))
              if hashlib.sha256(data).hexdigest()!=expected:
                  raise SystemExit('模組完整性驗證失敗：'+module)
              source=data.decode('utf-8')
              compile(source,module,'exec')
              return source
          
          sources={name:unpack(name,*content) for name,content in MODULES.items()}
          path=Path('radar.py')
          original=path.read_text(encoding='utf-8')
          m=re.search(r'<div class="eyebrow">STOCK RESEARCH LAB · (\d+\.\d+)</div>',original)
          if not m: raise SystemExit('找不到版本標記，拒絕修改研究別墅')
          version=m.group(1)
          if version not in ('1.21','1.22'):
              raise SystemExit('目前版本 '+version+'，僅允許 1.21 → 1.22 或重跑 1.22')
          
          if version=='1.21':
              replacements=[
                  ('小G 股票雷達 1.21：','小G 股票雷達 1.22：'),
                  ('<title>小G股票雷達 1.21</title>','<title>小G股票雷達 1.22</title>'),
                  ('STOCK RESEARCH LAB · 1.21','STOCK RESEARCH LAB · 1.22'),
                  ('from sector_indices import install_sector_indices',
                   'from sector_indices import install_sector_indices\nfrom site_quality import verify_site'),
                  ('''    SITE_FILE.write_text(page,encoding='utf-8')
              add_industry_briefs(SITE_FILE, UNIVERSE, INDUSTRY, records)
              install_mobile_tabs(SITE_FILE)
              install_villa_hub(SITE_FILE, records)
              install_famous_room(SITE_FILE)
              install_stock_search(SITE_FILE)
              install_sector_indices(SITE_FILE)''',
                  '''    # Build in a temporary file. A broken add-on must not replace a good report.
              stage_file = ROOT / 'index.stage.html'
              stage_file.write_text(page,encoding='utf-8')
              add_industry_briefs(stage_file, UNIVERSE, INDUSTRY, records)
              install_mobile_tabs(stage_file)
              install_villa_hub(stage_file, records)
              install_famous_room(stage_file)
              install_stock_search(stage_file)
              install_sector_indices(stage_file)
              verify_site(stage_file, records)
              stage_file.replace(SITE_FILE)''')
              ]
              changed=original
              for a,b in replacements:
                  if changed.count(a)!=1:
                      raise SystemExit('升級標記不符合預期：'+a[:80])
                  changed=changed.replace(a,b,1)
              compile(changed,'radar.py','exec')
              for name,source in sources.items():
                  Path(name).write_text(source,encoding='utf-8')
              path.write_text(changed,encoding='utf-8')
              print('1.22 最終驗收功能已安裝。原先交易資料與私人瀏覽器清單不受影響。')
          else:
              for name,source in sources.items():
                  if not Path(name).exists():
                      Path(name).write_text(source,encoding='utf-8')
              if 'from site_quality import verify_site' not in original:
                  raise SystemExit('標記為1.22但缺少驗收整合；停止以避免誤覆蓋')
              print('1.22 重複執行：保留現有版本與資料')
          PY_UPGRADE

      - name: 提交模組與網站版本
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py sector_indices.py site_quality.py
          if ! git diff --cached --quiet; then
            git commit -m 'Finish stock radar v1.22 with site quality checks'
            git push || { git fetch origin main; git rebase origin/main; git push; }
          fi

      - name: 準備 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝原有行情研究工具
        run: pip install -r requirements.txt
      - name: 產生並驗收完整股票研究網站
        run: python radar.py

      - name: 保存正常產生的報告與研究歷史
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated stock radar v1.22 report'
            git push || echo '::warning::其他掃描同時存檔；頁面仍可正常發布，後續自動排程會再保存'
          fi

      - name: 準備網頁發布檔案
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv maintenance_status.json berkshire_13f.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done
      - name: 上傳完整網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 正式發布 1.22 完工驗收版
        id: publish
        uses: actions/deploy-pages@v4
