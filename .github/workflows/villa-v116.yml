              print('1.16 已安裝，保留現有程式')
          else:
              if old.count('STOCK RESEARCH LAB · 1.15')!=1:
                  raise SystemExit('版本不是預期的 1.15；停止避免破壞原雷達')
              patches=[
                ('from mobile_tabs import install_mobile_tabs',
                 'from mobile_tabs import install_mobile_tabs\nfrom villa_hub import install_villa_hub'),
                ('    install_mobile_tabs(SITE_FILE)',
                 '    install_mobile_tabs(SITE_FILE)\n    install_villa_hub(SITE_FILE, records)'),
                ('小G 股票雷達 1.15：','小G 股票雷達 1.16：'),
                ('<title>小G股票雷達 1.15</title>','<title>小G股票雷達 1.16</title>'),
                ('STOCK RESEARCH LAB · 1.15','STOCK RESEARCH LAB · 1.16'),
              ]
              new=old
              for before,after in patches:
                  if new.count(before)!=1:
                      raise SystemExit('安裝位置不唯一，安全停止：'+before)
                  new=new.replace(before,after,1)
              compile(new,'radar.py','exec')
          # Validate both program strings before writing any file.
          Path('villa_hub.py').write_text(source,encoding='utf-8')
          if new!=old:
              radar_file.write_text(new,encoding='utf-8')
          print('股票雷達 1.16 入口與私人清單程式已安裝')
          PY_UPGRADE

      - name: 儲存新版程式（不修改舊排程或機密檔案）
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.py villa_hub.py
          if ! git diff --cached --quiet; then
            git commit -m 'Stock Radar 1.16: villa navigation and private watchlist'
            git push
          fi

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 使用既有掃描器產生新版網站
        run: |
          pip install -r requirements.txt
          python radar.py

      - name: 保存掃描報告與原有研究快照
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/history.csv
          for f in data/monthly_revenue.csv data/quarterly_profit.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Stock Radar 1.16 architecture'
            git push
          fi

      - name: 準備 GitHub Pages
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/history.csv _site/data/history.csv
          for f in monthly_revenue.csv quarterly_profit.csv; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done

      - name: 上傳手機網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: install
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 發布股票雷達 1.16
        id: publish
        uses: actions/deploy-pages@v4
